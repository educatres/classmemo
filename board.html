<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClassMemo 教室便條貼</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="board-page">
    <div id="config-error" class="config-error hidden">
      <h1>白板設定不完整</h1>
      <p>請回到老師設定頁重新產生白板連結。</p>
      <a class="primary-btn as-link" href="./index.html">回到老師設定頁</a>
    </div>

    <main id="board-app" class="board-app hidden">
      <header class="toolbar">
        <div class="toolbar-title">
          <div class="toolbar-label-row">
            <p class="eyebrow">匿名協作白板</p>
            <span id="student-edit-status" class="student-edit-status">（讀取中）</span>
          </div>
          <h1>ClassMemo 教室便條貼</h1>
        </div>
        <div class="toolbar-actions">
          <button class="ghost-btn" id="teacher-login-toggle" type="button">老師登入</button>
          <span id="note-count" class="sync-pill">0 張</span>
          <button class="ghost-btn hide-ui-btn" type="button" data-hide-ui>隱藏介面</button>
        </div>
      </header>

      <section id="teacher-panel" class="teacher-panel hidden" aria-live="polite">
        <div class="teacher-panel-heading">
          <div class="teacher-workspace-row">
            <p class="eyebrow">Teacher workspace</p>
            <span id="teacher-status" class="status-line"></span>
          </div>
          <p id="board-expiry" class="status-line">正在計算白板有效時間…</p>
        </div>
        <form id="teacher-login-form" class="teacher-login-form">
          <label>
            <span>老師六位數登入密鑰</span>
            <input id="teacher-login-pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
          </label>
          <button class="primary-btn" type="submit">登入老師控制台</button>
        </form>
        <div id="teacher-actions" class="teacher-actions hidden">
          <label class="freeze-control" for="freeze-board">
            <input id="freeze-board" type="checkbox" />
            <span>凍結學生編輯</span>
          </label>
          <div class="teacher-key-display">
            <span>老師密鑰：<b id="teacher-key-value">••••••</b></span>
            <button class="ghost-btn" id="toggle-teacher-key" type="button" aria-pressed="false">顯示</button>
            <button class="ghost-btn" id="copy-teacher-key" type="button">複製</button>
          </div>
          <div class="teacher-key-display">學生密鑰：<b id="student-key-value">讀取中…</b></div>
          <button class="ghost-btn" id="import-board" type="button">匯入白板 JSON</button>
          <input id="import-board-file" type="file" accept="application/json,.json" hidden />
          <button class="ghost-btn" id="show-board-qr" type="button">顯示連結 QR Code</button>
          <button class="ghost-btn" id="download-board" type="button">下載本白板資料 JSON</button>
          <button class="ghost-btn" id="download-board-png" type="button">下載白板 PNG</button>
          <button class="ghost-btn" id="download-board-svg" type="button">下載白板 SVG</button>
          <button class="ghost-btn danger-btn" id="clear-board" type="button">清除所有</button>
          <button class="ghost-btn danger-btn" id="delete-board" type="button">刪除本白板</button>
        </div>
        <p id="teacher-login-status" class="status-line"></p>
      </section>

      <section id="board" class="board" aria-label="便條貼白板">
        <div class="board-spacer" aria-hidden="true"></div>
        <div class="empty-state" id="empty-state">
          <h2>這裡還沒有便條貼</h2>
          <p>按右下角的 + 開始，或等待其他同學送出想法。</p>
        </div>
      </section>

      <span id="sync-status" class="sync-watermark">尚未同步</span>

      <button class="floating-add-note" id="add-note" type="button" aria-label="新增便條貼">+</button>
      <button class="show-ui-btn" type="button" data-show-ui>顯示</button>
    </main>

    <section id="student-access-panel" class="board-access-gate hidden" aria-live="polite" aria-labelledby="board-access-title">
      <div class="board-access-card">
        <p class="eyebrow">ClassMemo</p>
        <h1 id="board-access-title">請輸入密鑰以進入白板</h1>
        <form id="student-login-form" class="teacher-login-form">
          <label>
            <span>學生三位數登入密鑰</span>
            <input id="student-login-pin" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{3}" minlength="3" maxlength="3" required />
          </label>
          <button class="primary-btn" type="submit">進入白板</button>
        </form>
        <button id="gate-teacher-login-toggle" class="ghost-btn" type="button">使用老師六位數密鑰登入</button>
        <form id="gate-teacher-login-form" class="teacher-login-form hidden">
          <label>
            <span>老師六位數登入密鑰</span>
            <input id="gate-teacher-login-pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" minlength="6" maxlength="6" required />
          </label>
          <button class="primary-btn" type="submit">登入老師控制台</button>
        </form>
        <p id="student-login-status" class="status-line"></p>
      </div>
    </section>

    <section id="board-qr-modal" class="qr-modal hidden" role="dialog" aria-modal="true" aria-labelledby="board-qr-title">
      <div class="qr-modal-card">
        <button id="close-board-qr" class="qr-modal-close" type="button" aria-label="關閉 QR Code">×</button>
        <h2 id="board-qr-title">分享白板連結</h2>
        <div id="teacher-qr-code" class="qr-code" aria-label="白板 QR Code"></div>
        <p class="qr-student-key">學生登入密鑰：<b id="teacher-qr-student-key">讀取中…</b></p>
        <a id="teacher-qr-url" class="qr-url" href="#" target="_blank" rel="noopener"></a>
      </div>
    </section>

    <template id="note-template">
      <article class="note">
        <div class="note-toolbar">
          <select class="note-color" aria-label="便條貼顏色">
            <option value="yellow">黃色</option>
            <option value="pink">粉紅</option>
            <option value="blue">藍色</option>
            <option value="green">綠色</option>
            <option value="purple">紫色</option>
            <option value="orange">橘色</option>
          </select>
          <button class="icon-btn note-action edit-note" type="button" aria-label="編輯">編輯</button>
          <button class="icon-btn note-action delete-note" type="button" aria-label="刪除">刪除</button>
        </div>
        <div class="note-text" tabindex="0"></div>
        <textarea class="note-editor" rows="4"></textarea>
        <div class="resize-handle" aria-hidden="true"></div>
      </article>
    </template>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="./js/board.js"></script>
  </body>
</html>
